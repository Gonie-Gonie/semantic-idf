<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SemanticIDF Technical Reference</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./styles/guide-manual.css" />
  </head>
  <body class="guide-page" data-guide-manual>
    <a class="manual-skip-link" href="#manualContent">Skip to chapter</a>
    <header class="guide-header">
      <div>
        <p class="guide-kicker" data-app-brand-version>SemanticIDF v0.5.0</p>
        <h1 data-manual-label="title">Technical Reference Manual</h1>
      </div>
      <div class="guide-header-actions">
        <label class="manual-language"><span data-manual-label="language">Manual language</span>
          <select id="manualLanguage"><option value="en">English</option><option value="ko">한국어</option></select>
        </label>
        <a class="toolbar-link" href="./index.html" data-app-return data-i18n="action.backToApp">Back to App</a>
        <a class="toolbar-link" href="./tools.html" data-app-auxiliary data-i18n="action.tools">Tools</a>
        <a class="toolbar-link" href="./settings.html" data-app-auxiliary data-i18n="action.settings">Settings</a>
      </div>
    </header>
    <main class="manual-layout">
      <aside class="manual-sidebar">
        <label class="manual-search-label" for="manualSearch" data-manual-label="search">Search all chapters</label>
        <div class="manual-search-field"><input id="manualSearch" type="search" autocomplete="off" /><button id="manualSearchClear" type="button" data-manual-label="clear">Clear</button></div>
        <p class="manual-keyboard-hint" data-manual-label="shortcut">Press / to search, Escape to clear.</p>
        <details id="manualChapterDisclosure" class="manual-disclosure" open>
          <summary data-manual-label="chapters">Manual chapters</summary>
          <nav id="manualChapters" class="manual-chapters" aria-label="Manual chapters"></nav>
        </details>
      </aside>
      <div class="manual-main">
        <section id="manualSearchResults" class="manual-search-results" hidden aria-label="Search results"><h2 data-manual-label="results">Search results</h2><p id="manualSearchStatus" role="status" aria-live="polite"></p><div id="manualResultsList"></div></section>
        <div id="manualStatus" role="status" aria-live="polite" class="manual-status">Loading technical reference…</div>
        <article id="manualContent" class="manual-content" tabindex="-1" aria-label="Technical reference chapter"></article>
        <nav id="manualPagination" class="manual-pagination" aria-label="Previous and next chapters"></nav>
      </div>
      <aside class="manual-toc">
        <details id="manualSectionDisclosure" class="manual-disclosure" open>
          <summary data-manual-label="onThisPage">On this page</summary>
          <p class="manual-toc-title" data-manual-label="onThisPage">On this page</p>
          <nav id="manualSections" aria-label="Chapter sections"></nav>
        </details>
      </aside>
    </main>
    <script type="module" src="./js/auxiliary-navigation.js"></script>
    <script type="module" src="./js/guide-manual.js"></script>
  </body>
</html>
